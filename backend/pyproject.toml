[project]
name = "research-assistant-backend"
version = "0.1.0"
description = "Backend API for the Evidence-Grounded AI Research Assistant"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic>=1.20.0",
    "defusedxml>=0.7.1",
    "fastapi>=0.142.0",
    "httpx>=0.28.1",
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.1.2",
    "langsmith>=0.14.4",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.15.1",
    "pymupdf4llm>=1.28.2",
    "python-multipart>=0.0.32",
    "sentence-transformers>=6.1.0",
    "sqlalchemy[asyncio]>=2.1.1",
    "torch>=2.14.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false
# CI (setup-uv) installs this exact version; upgrade it together with your local uv.
required-version = "==0.12.21"

# CPU-only torch (D-049): the default PyPI wheel pulls in several GB of CUDA libraries.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not integration'"
markers = [
    "integration: needs the Supabase dev project and secrets; run with `uv run pytest -m integration`",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.isort]
# backend/alembic/ (migrations) would otherwise make the installed `alembic` look first-party.
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.9",
    "types-defusedxml>=0.7.0.20260504",
]
eval = [
    "langchain-community>=0.4.1,<0.4.2",
    "ragas>=0.4.3",
]
